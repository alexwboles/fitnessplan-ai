<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitnessPlan AI — workout planner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>FitnessPlan AI</h1>
  <p>Your goal, your schedule, your equipment → a full week of workouts. Free, private, in your browser.</p>
</header>
<nav class="tabs">
  <button data-tab="plan" class="active">My Plan</button>
  <button data-tab="library">Exercise Library</button>
  <button data-tab="log">Progress</button>
</nav>
<main>
  <section id="tab-plan" class="tabpage"></section>
  <section id="tab-library" class="tabpage" style="display:none"></section>
  <section id="tab-log" class="tabpage" style="display:none"></section>
</main>
<footer>FitnessPlan AI · 100% local — your data never leaves this browser. Not medical advice; check with a professional before starting a new program.</footer>
<script src="js/exercises.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
